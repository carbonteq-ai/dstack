# CarbonTeq dstack MVP: server on Dokploy, workloads on a separate LAN VM.
#
# The fork delta spans the Python server AND the Go runner/shim, so both are
# built here from the same commit. The `binaries` service serves the runner and
# shim over HTTP; the worker VM downloads them from it.
#
# Required variables (set these in Dokploy's Environment tab):
#
#   DSTACK_POSTGRES_PASSWORD    generated
#   DSTACK_SERVER_ADMIN_TOKEN   generated
#   DSTACK_BINARIES_URL         http://<dokploy-vm-lan-ip>:8080   (no trailing /)
#   DSTACK_SERVER_URL           http://<dokploy-vm-lan-ip>:3001
#
# Set once, never touched again. The release version is NOT among them: both
# images derive it from the git metadata in the build context, so every deploy
# is automatically versioned by the commit it was built from.
#
# Optional:
#
#   DSTACK_RELEASE_VERSION      pin the version instead of deriving it. Only for
#                               reproducing a specific build; normally unset.
#   DSTACK_SERVER_HOST_PORT     default 3001  (3000 is Dokploy's own UI)
#   DSTACK_BINARIES_HOST_PORT   default 8080

name: dstack-cp

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DSTACK_POSTGRES_USER:-dstack}
      POSTGRES_PASSWORD: ${DSTACK_POSTGRES_PASSWORD:?set a password}
      POSTGRES_DB: ${DSTACK_POSTGRES_DB:-dstack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ../../..
      dockerfile: docker/server/carbonteq/Dockerfile
      args:
        # Empty means "derive from the commit in the build context". Set
        # DSTACK_RELEASE_VERSION only to reproduce a specific historical build.
        RELEASE_VERSION: ${DSTACK_RELEASE_VERSION:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSTACK_DATABASE_URL: postgresql+asyncpg://${DSTACK_POSTGRES_USER:-dstack}:${DSTACK_POSTGRES_PASSWORD}@postgres:5432/${DSTACK_POSTGRES_DB:-dstack}
      DSTACK_SERVER_ADMIN_TOKEN: ${DSTACK_SERVER_ADMIN_TOKEN:?set an admin token}
      DSTACK_SERVER_URL: ${DSTACK_SERVER_URL:?set the server URL}
      DSTACK_SERVER_LOG_FORMAT: json
      DSTACK_SERVER_LOG_LEVEL: ${DSTACK_SERVER_LOG_LEVEL:-INFO}

      # One version drives the server, runner and shim, and it is baked into the
      # image rather than passed here. `{version}` below is substituted by the
      # server with that same value, and the binaries image serves exactly that
      # path — both derived from the same commit at build time.
      #
      # DSTACK_RUNNER_VERSION and DSTACK_SHIM_VERSION are intentionally absent:
      # `get_dstack_runner_version()` and `get_dstack_shim_version()` check
      # DSTACK_VERSION first, so those two were already dead settings.
      DSTACK_RUNNER_DOWNLOAD_URL: ${DSTACK_BINARIES_URL:?set the binaries URL}/{version}/binaries/dstack-runner-linux-{arch}
      DSTACK_SHIM_DOWNLOAD_URL: ${DSTACK_BINARIES_URL}/{version}/binaries/dstack-shim-linux-{arch}

      # Where the ctpolicy plugin reads team and user policy from. This is also
      # the compiled-in default; it is set explicitly so the bind mount below
      # and the path the plugin reads cannot drift apart.
      DSTACK_CT_POLICY_FILE: /etc/ctpolicy/policy.yaml
    volumes:
      # Run logs, and anything else dstack keeps on disk. Postgres holds the rest.
      - server-data:/root/.dstack/server
      # Projects, default permissions and the enabled plugin list, under version
      # control rather than generated into the volume. Read-only on purpose: with
      # the file present the server takes the apply_config() path, and
      # init_config() — which would write a generated `main`-only config over
      # it — never runs.
      #
      # This bind sits *inside* the server-data volume's mount point. Docker
      # applies mounts in order of destination depth, so the file lands on top of
      # the volume. Verify it after the first deploy rather than assuming:
      #   docker compose exec server head -3 /root/.dstack/server/config.yml
      - ./config.yml:/root/.dstack/server/config.yml:ro
      # Team and user policy. Unlike config.yml this IS re-read on change, so an
      # edit takes effect on the next `dstack apply` without a restart.
      - ./policy.yaml:/etc/ctpolicy/policy.yaml:ro
    networks:
      # `default` keeps postgres reachable; `dokploy-network` is what Traefik is
      # on, and without it a Dokploy domain answers 502 because the proxy has no
      # route to this container.
      - default
      - dokploy-network
    ports:
      # Host port 3000 belongs to Dokploy's own web UI, so default to 3001.
      - "${DSTACK_SERVER_HOST_PORT:-3001}:3000"

  # The worker VM downloads the fork's runner and shim from here, so this port
  # must be reachable from the worker over the LAN.
  binaries:
    build:
      context: ../../..
      dockerfile: docker/server/carbonteq/Dockerfile.binaries
      args:
        # Same contract as the server: empty derives from the commit. Both
        # images run the same version.sh over the same context, so the path
        # served here always matches the version the server asks for.
        VERSION: ${DSTACK_RELEASE_VERSION:-}
    restart: unless-stopped
    ports:
      # Verified free on a stock Dokploy host; override if yours differs.
      - "${DSTACK_BINARIES_HOST_PORT:-8080}:80"

networks:
  # Created by Dokploy. Running this stack outside Dokploy means creating it
  # first (`docker network create dokploy-network`) or dropping this block and
  # the server's `networks:` list.
  dokploy-network:
    external: true

volumes:
  postgres-data:
  server-data:
