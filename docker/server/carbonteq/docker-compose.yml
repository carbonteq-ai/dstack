# CarbonTeq dstack MVP: server on Dokploy, workloads on a separate LAN VM.
#
# The fork delta spans the Python server AND the Go runner/shim, so both are
# built here from the same commit. The `binaries` service serves the runner and
# shim over HTTP; the worker VM downloads them from it.
#
# Required variables (set these in Dokploy's Environment tab):
#
#   DSTACK_POSTGRES_PASSWORD    generated
#   DSTACK_SERVER_ADMIN_TOKEN   generated
#   DSTACK_RELEASE_VERSION      output of ./version.sh  (bump on every rebuild)
#   DSTACK_BINARIES_URL         http://<dokploy-vm-lan-ip>:8080   (no trailing /)
#   DSTACK_SERVER_URL           http://<dokploy-vm-lan-ip>:3001
#
# Optional, if the defaults clash with something else on the host:
#
#   DSTACK_SERVER_HOST_PORT     default 3001  (3000 is Dokploy's own UI)
#   DSTACK_BINARIES_HOST_PORT   default 8080

name: dstack-cp

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DSTACK_POSTGRES_USER:-dstack}
      POSTGRES_PASSWORD: ${DSTACK_POSTGRES_PASSWORD:?set a password}
      POSTGRES_DB: ${DSTACK_POSTGRES_DB:-dstack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ../../..
      dockerfile: docker/server/carbonteq/Dockerfile
      args:
        RELEASE_VERSION: ${DSTACK_RELEASE_VERSION:?run ./version.sh}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSTACK_DATABASE_URL: postgresql+asyncpg://${DSTACK_POSTGRES_USER:-dstack}:${DSTACK_POSTGRES_PASSWORD}@postgres:5432/${DSTACK_POSTGRES_DB:-dstack}
      DSTACK_SERVER_ADMIN_TOKEN: ${DSTACK_SERVER_ADMIN_TOKEN:?set an admin token}
      DSTACK_SERVER_URL: ${DSTACK_SERVER_URL:?set the server URL}
      DSTACK_SERVER_LOG_FORMAT: json
      DSTACK_SERVER_LOG_LEVEL: ${DSTACK_SERVER_LOG_LEVEL:-INFO}

      # One version drives the server, runner and shim. DSTACK_VERSION is baked
      # into the image by the Dockerfile; these two tell the server which
      # component build every worker must be running.
      DSTACK_RUNNER_VERSION: ${DSTACK_RELEASE_VERSION}
      DSTACK_SHIM_VERSION: ${DSTACK_RELEASE_VERSION}
      DSTACK_RUNNER_DOWNLOAD_URL: ${DSTACK_BINARIES_URL:?set the binaries URL}/{version}/binaries/dstack-runner-linux-{arch}
      DSTACK_SHIM_DOWNLOAD_URL: ${DSTACK_BINARIES_URL}/{version}/binaries/dstack-shim-linux-{arch}
    volumes:
      # config.yml (backend credentials) + run logs. Postgres holds the rest.
      - server-data:/root/.dstack/server
    networks:
      # `default` keeps postgres reachable; `dokploy-network` is what Traefik is
      # on, and without it a Dokploy domain answers 502 because the proxy has no
      # route to this container.
      - default
      - dokploy-network
    ports:
      # Host port 3000 belongs to Dokploy's own web UI, so default to 3001.
      - "${DSTACK_SERVER_HOST_PORT:-3001}:3000"

  # The worker VM downloads the fork's runner and shim from here, so this port
  # must be reachable from the worker over the LAN.
  binaries:
    build:
      context: ../../..
      dockerfile: docker/server/carbonteq/Dockerfile.binaries
      args:
        VERSION: ${DSTACK_RELEASE_VERSION}
    restart: unless-stopped
    ports:
      # Verified free on a stock Dokploy host; override if yours differs.
      - "${DSTACK_BINARIES_HOST_PORT:-8080}:80"

networks:
  # Created by Dokploy. Running this stack outside Dokploy means creating it
  # first (`docker network create dokploy-network`) or dropping this block and
  # the server's `networks:` list.
  dokploy-network:
    external: true

volumes:
  postgres-data:
  server-data:
