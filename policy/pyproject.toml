[project]
name = "ctpolicy"
version = "0.1.0"
description = "CarbonTeq team/user policy and quota layer for the dstack server."
requires-python = ">=3.10"

# Deliberately empty. docker/server/carbonteq/Dockerfile installs this wheel with
# `uv pip install --no-deps` so the server image keeps upstream's immutable,
# already-qualified dependency graph. Everything ctpolicy imports — pydantic v1,
# PyYAML, and dstack itself — is already in that image. Adding a dependency here
# would silently do nothing at build time and then fail at import inside the
# container, so do not add one without also changing the Dockerfile contract.
dependencies = []

[project.entry-points."dstack.plugins"]
ctpolicy = "ctpolicy:PolicyPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctpolicy"]

# Nested Ruff config: Ruff resolves settings from the closest pyproject.toml with
# a [tool.ruff] table, so this applies to policy/ without touching the root
# pyproject.toml (which is an upstream file we do not want to carry a diff in).
[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "Q", "W", "PGH", "FLY", "S113"]
ignore = ["E501", "E712"]

[tool.ruff.lint.isort]
# Only ctpolicy is first-party here. The root pyproject treats `dstack` as
# first-party because it *is* that project; from inside this package dstack is
# an ordinary third-party dependency, and classifying it that way keeps its
# imports in their own block.
known-first-party = ["ctpolicy"]
